# NexusOne — Render blueprint (render.yaml)
# Push this repo to GitHub and connect it in Render ("New → Blueprint").
# Render provisions PostgreSQL + Redis (managed) + MongoDB (container),
# builds all 9 backend services from backend/Dockerfile and the web app,
# and wires the environment automatically. Free tier services sleep after
# ~15 min idle and cold-start in under a minute.

databases:
  - name: nexusone-pg
    databaseName: nexusone
    user: nexusone
    plan: free
    region: oregon

  - name: nexusone-redis
    plan: free
    region: oregon

services:
  # ── MongoDB (Render has no managed MongoDB; run the official image). ─────
  # No auth is configured: the container is only reachable on Render's
  # private network. For real deployments, switch to MongoDB Atlas.
  - type: web
    name: nexusone-mongo
    runtime: docker
    dockerfilePath: deploy/mongo.Dockerfile
    plan: free
    region: oregon
    disk:
      name: mongodata
      mountPath: /data/db
      sizeGB: 1
    envVars:
      - key: MONGO_URI
        value: mongodb://nexusone-mongo:27017/nexusone

  # ── Backend services (each starts one NestJS app from the shared image) ──
  - type: web
    name: nexusone-auth
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: SERVICE
        value: auth
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: nexusone-pg
          property: connectionString
      - key: REDIS_URL
        fromDatabase:
          name: nexusone-redis
          property: connectionString
      - key: CLIENT_ORIGIN
        value: https://nexusone-web.onrender.com

  - type: web
    name: nexusone-org
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: SERVICE
        value: org
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        fromService:
          type: web
          name: nexusone-auth
          envVarKey: JWT_SECRET
      - key: DATABASE_URL
        fromDatabase:
          name: nexusone-pg
          property: connectionString
      - key: REDIS_URL
        fromDatabase:
          name: nexusone-redis
          property: connectionString
      - key: CLIENT_ORIGIN
        value: https://nexusone-web.onrender.com

  - type: web
    name: nexusone-chat
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: SERVICE
        value: chat
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        fromService:
          type: web
          name: nexusone-auth
          envVarKey: JWT_SECRET
      - key: MONGO_URI
        fromService:
          type: web
          name: nexusone-mongo
          envVarKey: MONGO_URI
      - key: REDIS_URL
        fromDatabase:
          name: nexusone-redis
          property: connectionString
      - key: CLIENT_ORIGIN
        value: https://nexusone-web.onrender.com

  - type: web
    name: nexusone-projects
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: SERVICE
        value: projects
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        fromService:
          type: web
          name: nexusone-auth
          envVarKey: JWT_SECRET
      - key: DATABASE_URL
        fromDatabase:
          name: nexusone-pg
          property: connectionString
      - key: REDIS_URL
        fromDatabase:
          name: nexusone-redis
          property: connectionString
      - key: CLIENT_ORIGIN
        value: https://nexusone-web.onrender.com

  - type: web
    name: nexusone-files
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    disk:
      name: uploads
      mountPath: /app/uploads
      sizeGB: 1
    envVars:
      - key: SERVICE
        value: files
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        fromService:
          type: web
          name: nexusone-auth
          envVarKey: JWT_SECRET
      - key: DATABASE_URL
        fromDatabase:
          name: nexusone-pg
          property: connectionString
      - key: CLIENT_ORIGIN
        value: https://nexusone-web.onrender.com

  - type: web
    name: nexusone-calendar
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: SERVICE
        value: calendar
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        fromService:
          type: web
          name: nexusone-auth
          envVarKey: JWT_SECRET
      - key: DATABASE_URL
        fromDatabase:
          name: nexusone-pg
          property: connectionString
      - key: REDIS_URL
        fromDatabase:
          name: nexusone-redis
          property: connectionString
      - key: CLIENT_ORIGIN
        value: https://nexusone-web.onrender.com

  - type: web
    name: nexusone-notifications
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: SERVICE
        value: notifications
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        fromService:
          type: web
          name: nexusone-auth
          envVarKey: JWT_SECRET
      - key: MONGO_URI
        fromService:
          type: web
          name: nexusone-mongo
          envVarKey: MONGO_URI
      - key: REDIS_URL
        fromDatabase:
          name: nexusone-redis
          property: connectionString
      - key: CLIENT_ORIGIN
        value: https://nexusone-web.onrender.com

  - type: web
    name: nexusone-ai
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: SERVICE
        value: ai
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        fromService:
          type: web
          name: nexusone-auth
          envVarKey: JWT_SECRET
      - key: CLIENT_ORIGIN
        value: https://nexusone-web.onrender.com

  - type: web
    name: nexusone-gateway
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: SERVICE
        value: gateway
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        fromService:
          type: web
          name: nexusone-auth
          envVarKey: JWT_SECRET
      # Public HTTPS targets: Render's `property: host` only yields a bare
      # private-network hostname, and blueprints can't interpolate a scheme/port
      # onto it. Public URLs are deterministic (Render subdomains follow
      # <name>.onrender.com) and match the CLIENT_ORIGIN / WS URLs above.
      # If a subdomain is taken at deploy time, update these to the actual ones.
      - key: SERVICE_AUTH_URL
        value: https://nexusone-auth.onrender.com
      - key: SERVICE_ORG_URL
        value: https://nexusone-org.onrender.com
      - key: SERVICE_CHAT_URL
        value: https://nexusone-chat.onrender.com
      - key: SERVICE_PROJECTS_URL
        value: https://nexusone-projects.onrender.com
      - key: SERVICE_FILES_URL
        value: https://nexusone-files.onrender.com
      - key: SERVICE_CALENDAR_URL
        value: https://nexusone-calendar.onrender.com
      - key: SERVICE_NOTIFICATIONS_URL
        value: https://nexusone-notifications.onrender.com
      - key: SERVICE_AI_URL
        value: https://nexusone-ai.onrender.com
      - key: CLIENT_ORIGIN
        value: https://nexusone-web.onrender.com

  # ── Web frontend ─────────────────────────────────────────────────────────
  - type: web
    name: nexusone-web
    runtime: docker
    dockerContext: ./frontend
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    # NEXT_PUBLIC_* must be BUILD args: they are inlined into the client bundle
    # (src/lib/ws.ts). The runtime env vars below only serve the server-side
    # rewrites in next.config.mjs, which read process.env at boot.
    buildArgs:
      - key: NEXT_PUBLIC_API_URL
        value: https://nexusone-gateway.onrender.com
      - key: NEXT_PUBLIC_CHAT_WS_URL
        value: wss://nexusone-chat.onrender.com
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://nexusone-gateway.onrender.com
      - key: NEXT_PUBLIC_CHAT_WS_URL
        value: wss://nexusone-chat.onrender.com
